name: verify

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the version this was developed on.
        node: [20.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # `shell: bash` runs with -eo pipefail, so a failure inside the pipe fails the step.
      - name: verify (setup, typecheck, lint, tests, multi-process race, build)
        shell: bash
        run: npm run verify 2>&1 | tee verify.log

      - name: sabotage (remove each guard, the tests must notice)
        shell: bash
        run: npm run test:sabotage 2>&1 | tee sabotage.log

      # Actions logs need a sign-in; the run summary does not. Published either way, so a
      # failure can be read from the run page.
      - name: publish output to the run summary
        if: always()
        shell: bash
        run: |
          for log in verify.log sabotage.log; do
            [ -f "$log" ] || continue
            {
              echo "<details><summary>${log} — node ${{ matrix.node }}</summary>"
              echo
              echo '```'
              tail -c 60000 "$log"
              echo '```'
              echo "</details>"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
