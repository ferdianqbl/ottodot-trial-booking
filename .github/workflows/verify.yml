name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the version this was developed on.
        node: [20.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # setup → typecheck → lint → tests → multi-process race → production build
      - run: npm run verify
      # proves the tests fail when the guards are removed; the output lands on the run summary,
      # which is readable without signing in
      - run: |
          # pipefail: without it the step's status would be tee's, hiding a failed mutation check
          set -o pipefail
          npm run test:sabotage | tee -a "$GITHUB_STEP_SUMMARY"
